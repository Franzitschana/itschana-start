<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Itschana – Podcast-Archiv</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eaf4f4;
      color: #123;
      text-align: center;
      padding: 30px 20px;
    }

    .box {
      max-width: 850px;
      margin: 40px auto;
      background: white;
      border-radius: 18px;
      padding: 30px 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      color: #2f6f73;
    }

    .eintrag {
      margin: 24px 0;
      padding: 22px 18px;
      border-radius: 16px;
      background: #f7fbfb;
      box-shadow: inset 0 0 0 1px rgba(47,111,115,0.08);
    }

    .datum {
      font-size: 1.05rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .titel {
      color: #456;
      margin-bottom: 14px;
    }

    iframe {
      border: none;
      max-width: 100%;
    }

    .hinweis {
      margin-top: 20px;
      color: #666;
      line-height: 1.5;
    }

    .nav {
      margin-top: 28px;
    }

    .nav a {
      text-decoration: none;
      color: #2f6f73;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🎧 Podcast-Archiv</h1>
    <div id="archiv"></div>

    <div class="nav">
      <a href="podcast-heute.html">Zum heutigen Podcast</a>
    </div>
  </div>

  <script src="podcasts.js"></script>
  <script>
    const archiv = document.getElementById("archiv");

    if (typeof podcasts === "undefined" || !Array.isArray(podcasts)) {
      archiv.innerHTML = `
        <div class="hinweis">
          Das Podcast-Archiv konnte nicht geladen werden.
        </div>
      `;
    } else {
      const sortiert = [...podcasts].sort((a, b) => b.datum.localeCompare(a.datum));

      archiv.innerHTML = sortiert.map(podcast => {
        const [jahr, monat, tag] = podcast.datum.split("-");
        const formatiertesDatum = `${tag}.${monat}.${jahr}`;

        return `
          <div class="eintrag">
            <div class="datum">${formatiertesDatum} – KIN ${podcast.kin} – ${podcast.name}</div>
            <div class="titel">${podcast.titel}</div>
            <iframe
              src="${podcast.audio}"
              width="100%"
              height="100"
              allow="autoplay"
              style="border:none;">
            </iframe>
          </div>
        `;
      }).join("");
    }
  </script>
</body>
</html>

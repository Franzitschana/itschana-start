<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jahreskalender-Generator · Itschana</title><link rel="icon" href="icon-512.png">
<style>
:root{--paper:#fffdf7;--ink:#172e33;--line:#80796c;--red:#c85245;--white:#f5f2e9;--blue:#4f7fa7;--yellow:#d8bd4b}
*{box-sizing:border-box}body{margin:0;background:#eee8dc;color:var(--ink);font:15px/1.35 Arial,sans-serif}
nav,.tools{max-width:1280px;margin:auto;padding:12px 18px}.tools{display:flex;gap:12px;align-items:end;flex-wrap:wrap;background:white;border-radius:14px;margin-top:12px}
label{font-weight:700}input,button{font:inherit;padding:9px 12px}button{border:0;border-radius:9px;background:#286b68;color:#fff;cursor:pointer}
.sheet{width:min(1280px,calc(100% - 24px));margin:14px auto 40px;background:var(--paper);border:1px solid #555;padding:12px;box-shadow:0 6px 25px #0002}
.head{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;border-bottom:2px solid var(--line);padding:5px 4px 10px}.head h1{margin:0;text-align:center;font-size:24px}.head .right{text-align:right}
.week{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line);margin-top:8px}
.day{min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;grid-template-rows:auto auto 1fr auto}
.dayhead{padding:6px;text-align:center;font-weight:700;border-bottom:1px solid var(--line)}.date{font-size:21px}.kin{padding:8px;min-height:150px}.kin strong{display:block;font-size:16px}.small{font-size:12px}.wave{padding:5px 7px;font-weight:700;border-top:1px solid #aaa}.bottom{padding:6px;border-top:1px solid var(--line);min-height:55px}.rune{font-weight:700}.note{max-width:1280px;margin:8px auto;padding:0 18px;color:#536266}
.c-red{background:#f5d8d2}.c-white{background:#f4f2ec}.c-blue{background:#dce9f3}.c-yellow{background:#f4ebbc}
@media(max-width:850px){.week{grid-template-columns:1fr}.sheet{width:calc(100% - 12px)}}
@media print{body{background:white}.tools,nav,.note{display:none}.sheet{width:100%;margin:0;box-shadow:none;border:0}.day{break-inside:avoid}}
</style></head><body>
<nav><a href="index.html">← Itschana</a> · <a href="tageszeitraum.html">Tagesraum</a></nav>
<section class="tools"><label>Jahr<br><input id="year" type="number" min="1990" max="2100" value="2027"></label><label>Woche ab Montag<br><input id="week" type="date" value="2027-01-04"></label><button id="make">Kalenderblatt erstellen</button><button onclick="print()">Drucken / PDF</button></section>
<p class="note"><strong>Jahreskalender-Generator · Arbeitsstand.</strong> Formbasis: BW65-Original. Tiroler Zahlenrad entfällt. Runenfeld ist aktiv; die originale Runenzuordnung wird noch aus BW65 übernommen und bis dahin nicht erfunden.</p>
<main class="sheet"><header class="head"><div>Natürlicher Jahreskalender</div><h1 id="title">Wochenblatt</h1><div class="right" id="range"></div></header><section class="week" id="days"></section></main>
<script src="itschana-calendar.js"></script><script>
let data=null; const colors={1:"white",2:"blue",3:"yellow",4:"red"};
const de=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
function monday(d){d=new Date(d);const n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);return d}
function iso(d){return ItschanaCalendar.isoFromDate(d)}
function fmt(d){return d.toLocaleDateString("de-AT",{day:"2-digit",month:"2-digit",year:"numeric"})}
function by(a,n){return a.find(x=>x.number===n)}
function draw(){
 if(!data)return; let start=ItschanaCalendar.dateFromIso(document.getElementById("week").value);if(!start)return;start=monday(start);
 document.getElementById("week").value=iso(start);document.getElementById("year").value=start.getFullYear();
 const end=new Date(start);end.setDate(end.getDate()+6);document.getElementById("title").textContent="Jahreskalender "+start.getFullYear();document.getElementById("range").textContent=fmt(start)+" – "+fmt(end);
 const host=document.getElementById("days");host.innerHTML="";
 for(let i=0;i<7;i++){const d=new Date(start);d.setDate(d.getDate()+i);const kn=ItschanaCalendar.kinForDate(d),k=by(data.kins,kn),t=by(data.tones,k.toneNumber),f=by(data.figures,k.figureNumber),w=by(data.figures,k.waveFigureNumber),col=colors[f.colorIndex]||"white";
  const el=document.createElement("article");el.className="day c-"+col;
  el.innerHTML='<div class="dayhead">'+de[d.getDay()]+'<div class="date">'+d.getDate()+'.'+(d.getMonth()+1)+'.</div></div><div class="kin"><strong>KIN '+k.number+'</strong><strong>'+k.name+'</strong><p>Ton '+t.number+' · '+t.keyword+'</p><p class="small">'+f.flhText+'<br>'+f.purpose+'</p></div><div class="wave c-'+(colors[w.colorIndex]||"white")+'">Welle · '+w.shortName+'</div><div class="bottom"><div><strong>Ebene:</strong> '+t.dimension.replace("Dimension der ","")+'</div><div class="rune">Rune · —</div><div class="small">28-Tage-Tag · wird aus BW65-Regel ergänzt</div></div>';
  host.appendChild(el)}
}
document.getElementById("make").onclick=draw;document.getElementById("year").onchange=e=>{document.getElementById("week").value=e.target.value+"-01-04";draw()};
fetch("data/itschana-flh.json").then(r=>r.json()).then(d=>{data=d;draw()});
</script></body></html>
